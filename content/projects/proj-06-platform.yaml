id: proj-06-platform
track: aiinfra
title: 06 可觀察的小型 Kubernetes 平台
summary: 讓兩個版本的測試服務有明確就緒狀態、請求指標與回復手冊。
why: 證明會用訊號定位問題，不只是交出幾份宣告檔。
modules:
  - ai-k8s
  - ai-observe
level: 3
hours: 32
milestones:
