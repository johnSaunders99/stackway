id: "iv-fs-system-design"
title: "全端系統設計"
track: "fullstack"
questions:
  - id: "iv-fs-system-design-seat"
    question: "兩個人同時訂最後一席，在哪一層保證不超賣？"
    points:
      - "資料庫是權威來源"
      - "交易或條件式更新"
      - "重送請求防重"
    answer: "按鈕停用只能改善體驗。伺服器用交易內的條件式更新扣位，僅有成功更新的人得到預約。保留冪等鍵與結果，讓網路重送不再扣一次。"
    tags:
      - "transactions"
  - id: "iv-fs-system-design-page"
    question: "時間軸更新很快，第二頁常出現上一頁的資料，怎麼改？"
    points:
      - "穩定排序與次鍵"
      - "以游標續讀"
      - "解釋一致性限制"
    answer: "以建立時間和唯一識別值排出穩定順序，傳最後一列的兩個值作游標。它比位移分頁不易受新插入影響；若允許修改排序欄位，仍須另定快照或接受畫面變動。"
    tags:
      - "pagination"
  - id: "iv-fs-system-design-owner"
    question: "一個已登入的人可以編輯任何人的筆記，設計上漏了什麼？"
    points:
      - "身分驗證不等於授權"
      - "伺服器端逐筆判斷"
      - "雙角色回歸測試"
    answer: "要檢查登入身分是否有權編輯目標筆記，不把瀏覽器送來的擁有者值當事實。以兩組測試身分驗證自己的資料可寫、別人的資料不可寫。"
    tags:
      - "authorization"
  - id: "iv-fs-system-design-upload"
    question: "大型檔案上傳到一半中斷，如何讓使用者不用全部重來？"
    points:
      - "分段與上傳識別"
      - "承認哪些段已存在"
      - "完成前不對外可見"
    answer: "伺服器保留分段清單與完整性資訊，重連後只重送缺段。組裝完成並通過完整性驗證才發布，逾期暫存另設清理政策，介面顯示可繼續而非假裝成功。"
    tags:
      - "uploads"
  - id: "iv-fs-system-design-cache"
    question: "修改商品後仍看到舊價格，會先追哪兩個位置？"
    points:
      - "比較權威資料與快取"
      - "辨識鍵與生命週期"
      - "說明修復驗收"
    answer: "先直接讀權威資料及該商品的快取值，再核對寫入路徑是否使正確的鍵失效。對價格敏感的結帳流程重新核價，以更新後的讀取與快取失效測試驗收。"
    tags:
      - "cache"
  - id: "iv-fs-system-design-email"
    question: "訂單成立後寄信服務暫停，是否要讓下單失敗？"
    points:
      - "劃定交易邊界"
      - "可重試的後續工作"
      - "處理重複與積壓"
    answer: "若商業承諾是訂單成立，將訂單與待寄事件一起可靠保存，讓背景工作稍後寄出。寄信需防重並觀察積壓；介面說明通知待送，不把已成立的訂單顯示成失敗。"
    tags:
      - "queue"
  - id: "iv-fs-system-design-migration"
    question: "正式服務要把一個欄位拆成兩個，回復舊版時怎麼辦？"
    points:
      - "先擴充再切換"
      - "回填與核對"
      - "淘汰前保留相容性"
    answer: "先新增欄位而不移除舊欄位，讓新舊版本讀寫規則可共存。小批回填並比對，再切換讀取。過了回復期限且確認沒有舊呼叫端，才移除舊資料。"
    tags:
      - "schema"
  - id: "iv-fs-system-design-slow"
    question: "頁面載入很慢，應該先換前端框架嗎？"
    points:
      - "拆解等待階段"
      - "以相同條件觀察"
      - "針對最大瓶頸"
    answer: "先看網路時間線、服務回應時間與主執行緒工作。若主要時間花在資料庫，換框架不是第一步；挑一項改動，用相同資料量和裝置對照改善與副作用。"
    tags:
      - "performance"
