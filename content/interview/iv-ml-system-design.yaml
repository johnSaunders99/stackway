id: "iv-ml-system-design"
title: "ML 與 AI 基礎設施設計"
track: "aiinfra"
questions:
  - id: "iv-ml-system-design-tokens"
    question: "如何公平比較兩種推論服務設定？"
    points:
      - "固定模型與負載"
      - "分開首詞元延遲與整筆請求的完成延遲"
      - "同時量品質與失敗"
    answer: "固定硬體、模型版本、提示與輸出長度分布，暖機後重播相同請求。分開報告首個詞元、完成延遲、吞吐及失敗數；精度變更必須再比品質。"
    tags:
      - "benchmarking"
  - id: "iv-ml-system-design-memory"
    question: "GPU 記憶體不足時，換成較低精度就一定夠嗎？"
    points:
      - "區分權重與快取"
      - "考慮並行及上下文"
      - "驗證精度影響"
    answer: "先估權重、KV 快取與暫存各佔多少。如果主因是長上下文加高並行，只縮權重可能仍不足。逐一改變限制，核對記憶體峰值、延遲與品質。"
    tags:
      - "memory"
  - id: "iv-ml-system-design-lineage"
    question: "昨天表現好的模型今天無法重現，模型登錄紀錄該補什麼？"
    points:
      - "資料與切分版本"
      - "程式與環境識別"
      - "參數與原始評估"
    answer: "模型名稱不夠，登記輸入快照、切分方式、程式版本、相依環境、參數與評估產物。先用固定輸入重跑推論，再決定差異來自訓練還是服務封裝。"
    tags:
      - "mlops"
  - id: "iv-ml-system-design-tenant"
    question: "互動式問答與夜間批次共用服務時，如何保住體驗？"
    points:
      - "分類流量與目標"
      - "隔離配額與佇列"
      - "定義過載策略"
    answer: "先為互動流量訂首詞元延遲目標，再依租戶與用途分開配額。批次在尖峰排隊或暫停，對超額請求明確回報；以高峰重播驗證互動與批次都不會永久飢餓。"
    tags:
      - "multitenancy"
  - id: "iv-ml-system-design-quality"
    question: "模型部署後業務指標下降，但離線分數沒變，怎麼查？"
    points:
      - "核對線上資料分布"
      - "比對前處理與版本"
      - "保留回復準則"
    answer: "按版本切分流量，對同一批輸入比較離線與線上的特徵和結果。若線上前處理不一致，修正管線；若為分布變動，補近期驗證集，達到停止門檻先回復。"
    tags:
      - "drift"
  - id: "iv-ml-system-design-scale"
    question: "排隊時間變長就應該增加 GPU 副本嗎？"
    points:
      - "區分排隊與執行"
      - "查工作負載分布"
      - "考慮冷啟動與預算"
    answer: "先看輸入長度、到達率、健康副本與每批處理時間。若佇列卡在下游或模型尚未就緒，盲目擴容可能無效。先用小幅變更驗證能縮短使用者等待。"
    tags:
      - "autoscaling"
  - id: "iv-ml-system-design-rag"
    question: "RAG 沒找到正確答案，怎麼拆成兩個能驗收的部分？"
    points:
      - "檢索與生成分測"
      - "固定文件及查詢"
      - "保留來源與版本"
    answer: "用有標註的小型查詢集測正確文件是否進入候選，再把正確文件直接給生成端。兩個實驗分開判斷問題，記錄索引版本與引用，才能比較下一次改版。"
    tags:
      - "rag"
  - id: "iv-ml-system-design-cost"
    question: "團隊說吞吐變高代表一定比較便宜，你同意嗎？"
    points:
      - "定義成本分母"
      - "計入閒置與失敗"
      - "固定品質門檻"
    answer: "以達到品質與延遲門檻的成功請求作分母，計入閒置、重試與硬體時數。更大的批次可能提升吞吐卻讓大量請求超時；需在同一需求分布下重算。"
    tags:
      - "cost"
